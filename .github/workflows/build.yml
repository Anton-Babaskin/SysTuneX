name: Build

on:
  # Every branch, so a feature branch gets the same build and the same downloadable
  # SysTuneX.exe as main does. Only the release job is gated on the default branch.
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >
          Publish a GitHub Release with this tag (e.g. v2.0.0). Leave empty to just build.
          The tag is created at the dispatched commit if it does not exist yet.
        required: false
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every action is pinned to a full commit SHA, with the release it came from as a comment.
#
# A tag is a pointer its owner can move, and this workflow builds an executable people run as
# administrator, then publishes it with write access to the repository. A major tag such as
# @v7 would run whatever it pointed at on the day - including code pushed by someone who had
# taken over that action's repository. A SHA can only ever mean one commit.
#
# Pinning trades automatic patches for deliberate ones, so Dependabot (.github/dependabot.yml)
# proposes new releases weekly and updates the SHA and the comment together. Stay on current
# majors all the same: the v4 actions targeted Node.js 20, were force-run on Node 24 and warned
# on every run, and a warning today is a failed build the day the runners drop the shim.
jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SysTuneX.sln

      - name: Build
        run: dotnet build SysTuneX.sln --configuration Release --no-restore

      # The catalog, journal and localization tests are the guard against the data mistakes
      # that are invisible in review: duplicate tweak ids, untranslated entries, a revert that
      # would write a value Windows never shipped.
      - name: Test core
        run: dotnet test tests/SysTuneX.Core.Tests/SysTuneX.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      # XAML is parsed at run time, so a compile-only pipeline says nothing about whether the
      # app starts. These tests build the real Application, realise every resource and construct
      # the window and every page through the container - on a runner with no display, which
      # is fine because none of it is ever shown.
      - name: Test startup
        run: dotnet test tests/SysTuneX.App.Tests/SysTuneX.App.Tests.csproj --configuration Release --no-build --verbosity normal

  publish:
    name: Publish SysTuneX.exe
    runs-on: windows-latest
    needs: test

    # Naming one permission drops every one not named, so contents: read is here for the
    # checkout. The other two exist for the provenance step and nothing else: id-token lets the
    # job prove to Sigstore which workflow and commit it is, attestations lets it store the
    # signed result. Neither can change the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file executable
        run: >
          dotnet publish src/SysTuneX.App/SysTuneX.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item publish/SysTuneX.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  SysTuneX.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii
          "SysTuneX.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Write-Host
          "SHA256: $hash" | Write-Host

      # A signed statement, kept by GitHub, that this exact file came out of this workflow at this
      # commit. The checksum above proves the same thing only to someone who finds this run and
      # reads its log; `gh attestation verify` checks this in one command. The release job uploads
      # the artifact below unchanged, so the attestation covers the released file too.
      #
      # Skipped on pull_request runs: a pull request from a fork gets no OIDC token, so the step
      # would fail every outside contribution, and a branch in this repository is already
      # attested by its own push run. Skipped for Dependabot's branches too, whose runs GitHub
      # treats like a fork's - and which are never released anyway.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/SysTuneX.exe

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SysTuneX-win-x64
          path: |
            publish/SysTuneX.exe
            publish/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: publish

    # Only from the default branch. A release cut from a feature branch describes code that
    # nobody has merged yet, and leaves the tag pointing at a commit that may never reach main.
    # Feature branches still build, test and attach an artifact to the run - they just do not
    # get to mint a version.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SysTuneX-win-x64
          path: publish

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OVERRIDE: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="${TAG_OVERRIDE:-}"
          if [ -z "$tag" ] && [ -f release.version ]; then
            tag="$(tr -d '[:space:]' < release.version)"
          fi

          if [ -z "$tag" ]; then
            echo "No release.version file and no release_tag input - nothing to publish."
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # A published release is never changed underneath the people who downloaded it and
            # checked its hash; RELEASING.md promises as much. This used to upload with --clobber,
            # so every merge that did not bump release.version silently replaced the binary and
            # its checksum, under release notes that described neither. Now such a merge simply
            # does not release.
            #
            # The one exception is a release a failed run left without its files. Nobody can have
            # verified a download that is not there, so both go up again together - the
            # executable and its checksum must always come from the same build.
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -qx 'SysTuneX.exe' <<< "$assets" && grep -qx 'SHA256SUMS.txt' <<< "$assets"; then
              echo "::notice::$tag is already published and its files are left as they are. Bump release.version to release this build."
              exit 0
            fi

            echo "$tag exists but is missing its files; uploading the executable and its checksum together."
            gh release upload "$tag" publish/SysTuneX.exe publish/SHA256SUMS.txt --clobber
            exit 0
          fi

          # Only this version's section. Pasting the whole changelog into every release is what
          # made v2.4.0's page open with notes for 2.0.1.
          notes=notes.md
          awk -v tag="$tag" '
            $0 == "## " tag { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "::warning::CHANGELOG.md has no section for $tag; falling back to generated notes."
            rm -f "$notes"
            notes_args=(--generate-notes)
          else
            # The parts that are true of every release - download, checksum, SmartScreen,
            # known limitations - live in one file rather than being restated per version.
            if [ -f docs/release-footer.md ]; then
              printf '\n---\n\n' >> "$notes"
              cat docs/release-footer.md >> "$notes"
            fi
            notes_args=(--notes-file "$notes")
          fi

          # A version with a suffix (v2.5.0-beta, -rc1) is a pre-release; a plain one is not.
          # That puts the choice in the version string instead of a workflow default that
          # quietly marked every build as unfinished.
          case "$tag" in
            *-*) prerelease_args=(--prerelease) ;;
            *)   prerelease_args=(--latest) ;;
          esac

          gh release create "$tag" \
            publish/SysTuneX.exe publish/SHA256SUMS.txt \
            --title "SysTuneX ${tag#v}" \
            --target "${{ github.sha }}" \
            "${notes_args[@]}" \
            "${prerelease_args[@]}"

          {
            echo "### SysTuneX $tag published"
            echo
            echo "- Release page: $(gh release view "$tag" --json url --jq .url)"
            echo "- Direct download: https://github.com/${{ github.repository }}/releases/download/$tag/SysTuneX.exe"
          } >> "$GITHUB_STEP_SUMMARY"
