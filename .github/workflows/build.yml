name: Build

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >
          Publish a GitHub Release with this tag (e.g. v2.0.0). Leave empty to just build.
          The tag is created at the dispatched commit if it does not exist yet.
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore SysTuneX.sln

      - name: Build
        run: dotnet build SysTuneX.sln --configuration Release --no-restore

      # The catalog, journal and localization tests are the guard against the data mistakes
      # that are invisible in review: duplicate tweak ids, untranslated entries, a revert that
      # would write a value Windows never shipped.
      - name: Test
        run: dotnet test tests/SysTuneX.Core.Tests/SysTuneX.Core.Tests.csproj --configuration Release --no-build --verbosity normal

  publish:
    name: Publish SysTuneX.exe
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file executable
        run: >
          dotnet publish src/SysTuneX.App/SysTuneX.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item publish/SysTuneX.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  SysTuneX.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii
          "SysTuneX.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Write-Host
          "SHA256: $hash" | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysTuneX-win-x64
          path: |
            publish/SysTuneX.exe
            publish/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: publish
    # Only when a tag was passed by hand. Actions artifacts need a GitHub login and arrive
    # as a zip; a release asset is a plain HTTPS download, which is what people actually want.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built executable
        uses: actions/download-artifact@v4
        with:
          name: SysTuneX-win-x64
          path: publish

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          notes_args=(--generate-notes)
          if [ -f docs/release-notes.md ]; then
            notes_args=(--notes-file docs/release-notes.md)
          fi

          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args=(--prerelease)
          fi

          # Re-running the same tag updates the existing release rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/SysTuneX.exe publish/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              publish/SysTuneX.exe publish/SHA256SUMS.txt \
              --title "SysTuneX ${TAG#v}" \
              --target "${{ github.sha }}" \
              "${notes_args[@]}" \
              "${prerelease_args[@]}"
          fi

          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
          echo "Direct download: https://github.com/${{ github.repository }}/releases/download/$TAG/SysTuneX.exe"
