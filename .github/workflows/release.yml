name: Release

# Pushing a v* tag builds the executable on a Windows runner and publishes it as a
# GitHub Release asset. Release assets are a plain HTTPS download with no sign-in and
# no zip wrapper, unlike the artifacts the CI workflow attaches to a run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore SysTuneX.sln

      - name: Build
        run: dotnet build SysTuneX.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SysTuneX.Core.Tests/SysTuneX.Core.Tests.csproj --configuration Release --no-build

      - name: Publish single-file executable
        run: >
          dotnet publish src/SysTuneX.App/SysTuneX.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item publish/SysTuneX.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  SysTuneX.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii
          "Size: {0:N1} MB" -f ($exe.Length / 1MB) | Write-Host
          "SHA256: $hash" | Write-Host

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $notes = if (Test-Path 'docs/release-notes.md') { 'docs/release-notes.md' } else { $null }

          # The release is created on first run and updated on a re-run of the same tag,
          # so re-running the workflow never fails on "release already exists".
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag publish/SysTuneX.exe publish/SHA256SUMS.txt --clobber
          }
          else {
              $args = @(
                  'release', 'create', $tag,
                  'publish/SysTuneX.exe', 'publish/SHA256SUMS.txt',
                  '--title', "SysTuneX $($tag.TrimStart('v'))",
                  '--prerelease',
                  '--target', '${{ github.sha }}'
              )
              if ($notes) { $args += @('--notes-file', $notes) }
              else { $args += @('--generate-notes') }
              gh @args
          }

          gh release view $tag --json url --jq .url
